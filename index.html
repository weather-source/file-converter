<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转 · 本地文件转换器</title>
<meta name="description" content="纯浏览器端本地文件转换工具：图片格式互转、常见文档格式互转，文件不会上传到任何服务器。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fff' font-family='monospace'%3E%E8%BD%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="site-header">
  <div class="brand"><span class="logo">转</span><h1>本地文件转换器</h1></div>
  <p class="tagline">所有转换均在你的浏览器内完成 · 文件不会离开设备</p>
</header>

<main>
  <!-- 步骤 1 -->
  <section class="step" id="step1">
    <div class="step-head"><span class="step-num">01</span><h2>选择文件</h2></div>
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="点击或拖拽选择文件">
      <div class="dz-icon">⇩</div>
      <p class="dz-main">点击选择 / 拖拽文件到此处</p>
      <p class="dz-sub">支持多选 · 可粘贴 Ctrl+V</p>
      <p class="dz-formats">图片：PNG / JPG / WEBP / GIF / BMP / ICO / SVG / AVIF<br>文档：MD / TXT / HTML / CSV / JSON</p>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <ul id="fileList" class="file-list"></ul>
  </section>

  <!-- 步骤 2 -->
  <section class="step" id="step2">
    <div class="step-head"><span class="step-num">02</span><h2>选择目标格式</h2></div>
    <div id="formatGroup" class="format-group">
      <p class="empty-hint">请先在上方添加文件</p>
    </div>
    <div id="qualityRow" class="quality-row" hidden>
      <label for="quality">图片质量</label>
      <input type="range" id="quality" min="10" max="100" value="90">
      <span id="qualityVal">90%</span>
    </div>
  </section>

  <!-- 步骤 3 -->
  <section class="step" id="step3">
    <div class="step-head"><span class="step-num">03</span><h2>转换并下载</h2></div>
    <button id="convertBtn" class="btn-primary" disabled>开始转换</button>
    <ul id="resultList" class="result-list"></ul>
    <p id="doneNote" class="done-note" hidden>✓ 全部完成，文件已开始下载</p>
  </section>
</main>

<footer class="site-footer">
  <p>纯前端实现 · 无服务器 · 无上传 · 数据 100% 留在本地</p>
</footer>

<script src="app.js"></script>
</body>
</html>
